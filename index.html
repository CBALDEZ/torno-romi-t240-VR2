```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Realidade Mista - Torno ROMI T240 | SENAI</title>

  <!-- Biblioteca A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .btn-voltar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 11px 17px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid white;
    }

    .instrucoes-vr {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    .aviso {
      position: fixed;
      top: 65px;
      left: 15px;
      z-index: 9999;
      max-width: 85%;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <a href="index.html" class="btn-voltar">
    ← Voltar ao Menu
  </a>

  <div class="aviso" id="status-modelo">
    Carregando modelo 3D do torno...
  </div>

  <div class="instrucoes-vr">
    Mire nos marcadores coloridos para consultar as informações.
    Use o mouse para olhar ao redor.
  </div>

  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: true"
    loading-screen="enabled: true">

    <!-- ARQUIVO 3D -->
    <a-assets timeout="20000">
      <a-asset-item
        id="modelo-torno"
        src="./romi_t240_modelo_3d_melhorado.glb">
      </a-asset-item>
    </a-assets>

    <!-- FUNDO E ILUMINAÇÃO -->
    <a-sky color="#DCE6EE"></a-sky>

    <a-entity
      light="type: ambient; color: #FFFFFF; intensity: 1.5">
    </a-entity>

    <a-entity
      light="type: directional; color: #FFFFFF; intensity: 2"
      position="-3 6 5">
    </a-entity>

    <a-entity
      light="type: directional; color: #FFFFFF; intensity: 1"
      position="3 4 -2">
    </a-entity>

    <!-- MODELO 3D DO TORNO -->
    <a-entity
      id="torno-container"
      position="0 0 -3"
      rotation="0 0 0"
      scale="0.7 0.7 0.7">

      <a-gltf-model
        id="modelo-torno-3d"
        src="#modelo-torno"
        position="0 0 0"
        rotation="0 0 0">
      </a-gltf-model>

    </a-entity>

    <!-- PAINEL DE INFORMAÇÕES -->
    <a-entity id="painel-info" position="0 2.75 -2.8">

      <a-plane
        width="2.7"
        height="0.85"
        color="#10202B"
        material="shader: flat; opacity: 0.96">

      </a-plane>

      <a-text
        id="texto-painel"
        value="LUBRIFICACAO - ROMI T240&#10;&#10;Selecione um marcador A, B, C, D, E ou F."
        align="center"
        anchor="center"
        baseline="center"
        width="2.5"
        color="#00FFCC"
        position="0 0 0.02">
      </a-text>

    </a-entity>

    <!-- MARCADOR A -->
    <a-sphere
      class="clickable"
      position="0.3 0.85 -2.85"
      radius="0.075"
      material="color: #E74C3C; emissive: #551111"
      data-info="PONTO A - BARRAMENTO E GUIAS&#10;&#10;Lubrificante: ISO VG 68&#10;Frequencia: diaria&#10;Metodo: aplicar camada fina com almotolia">

      <a-text
        value="A"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#FFFFFF">
      </a-text>
    </a-sphere>

    <!-- MARCADOR B -->
    <a-sphere
      class="clickable"
      position="0 1.35 -2.6"
      radius="0.075"
      material="color: #F1C40F; emissive: #554400"
      data-info="PONTO B - CARRO E GUIAS&#10;&#10;Lubrificante: verificar manual da maquina&#10;Frequencia: conforme plano de manutencao&#10;Metodo: seguir o procedimento indicado pelo fabricante">

      <a-text
        value="B"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#111111">
      </a-text>
    </a-sphere>

    <!-- MARCADOR C -->
    <a-sphere
      class="clickable"
      position="-0.7 1.35 -2.85"
      radius="0.075"
      material="color: #2ECC71; emissive: #114422"
      data-info="PONTO C - CABECOTE FIXO&#10;&#10;Verificar nivel e especificacao do oleo&#10;Consultar o manual do ROMI T240&#10;Respeitar o nivel indicado no visor">

      <a-text
        value="C"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#FFFFFF">
      </a-text>
    </a-sphere>

    <!-- MARCADOR D -->
    <a-sphere
      class="clickable"
      position="-0.9 1.1 -2.4"
      radius="0.075"
      material="color: #3498DB; emissive: #102F55"
      data-info="PONTO D - CAIXA NORTON&#10;&#10;Verificar nivel e condicao do lubrificante&#10;Confirmar especificacao e intervalo de troca no manual">

      <a-text
        value="D"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#FFFFFF">
      </a-text>
    </a-sphere>

    <!-- MARCADOR E -->
    <a-sphere
      class="clickable"
      position="0 0.9 -2.35"
      radius="0.075"
      material="color: #9B59B6; emissive: #331144"
      data-info="PONTO E - AVENTAL DO CARRO&#10;&#10;Inspecionar pontos de lubrificacao&#10;Consultar o plano de manutencao e o manual do fabricante">

      <a-text
        value="E"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#FFFFFF">
      </a-text>
    </a-sphere>

    <!-- MARCADOR F -->
    <a-sphere
      class="clickable"
      position="-1.05 1.2 -2.85"
      radius="0.075"
      material="color: #E67E22; emissive: #552200"
      data-info="PONTO F - ENGRENAGENS DA LIRA&#10;&#10;Verificar necessidade de lubrificacao&#10;Usar o lubrificante especificado pelo fabricante&#10;Evitar excesso de graxa">

      <a-text
        value="F"
        align="center"
        anchor="center"
        position="0 0 0.09"
        width="1.5"
        color="#FFFFFF">
      </a-text>
    </a-sphere>

    <!-- CAMERA E MIRA -->
    <a-entity position="0 1.6 0">

      <a-camera
        id="camera"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false">

        <a-entity
          cursor="rayOrigin: entity; fuse: false"
          raycaster="objects: .clickable; far: 10"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
          material="shader: flat; color: #00FFCC">
        </a-entity>

      </a-camera>

    </a-entity>

  </a-scene>

  <script>
    const textoPainel = document.getElementById("texto-painel");
    const statusModelo = document.getElementById("status-modelo");
    const modelo = document.getElementById("modelo-torno-3d");

    // Verifica se o arquivo GLB foi carregado
    modelo.addEventListener("model-loaded", function () {
      statusModelo.textContent = "Modelo 3D carregado.";
      statusModelo.style.background = "rgba(0,100,40,0.9)";
    });

    modelo.addEventListener("model-error", function () {
      statusModelo.textContent =
        "Erro ao carregar o GLB. Confira o nome e o caminho do arquivo.";
      statusModelo.style.background = "rgba(150,0,0,0.9)";
      console.error("Falha ao carregar o modelo ROMI T240.");
    });

    // Atualiza o painel quando o usuário mira ou seleciona um marcador
    document.querySelectorAll(".clickable").forEach(function (ponto) {

      ponto.addEventListener("mouseenter", function () {
        textoPainel.setAttribute(
          "value",
          ponto.getAttribute("data-info")
        );
        textoPainel.setAttribute("color", "#FFFFFF");
      });

      ponto.addEventListener("mouseleave", function () {
        textoPainel.setAttribute("color", "#00FFCC");
      });

      ponto.addEventListener("click", function () {
        textoPainel.setAttribute(
          "value",
          ponto.getAttribute("data-info")
        );
        textoPainel.setAttribute("color", "#00FFCC");
      });

    });
  </script>

</body>
</html>
```
